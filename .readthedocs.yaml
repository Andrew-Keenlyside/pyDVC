version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .              # zvdvc + zarr-vectors (pinned commit); GPU and numba modules are mocked in conf.py
    - requirements: docs/requirements-docs.txt
